name: measure-visibility

# W3: misst an den im Weitsicht-Admin gesetzten Referenzpunkten die aktuelle
# Fernsicht je Panorama-Cam und postet sie an api/webcam-ingest.php.
#
# Ausgelöst per workflow_dispatch (zuverlässiger Trigger kommt aus dem Weitsicht-
# Cron via GitHub-API, analog forecast-/cams-Fetcher). Der schedule unten ist nur
# ein Fallback; GitHub-Schedules laufen unzuverlässig.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-Run: nur messen + Kontrast loggen, NICHT ins Backend schreiben"
        type: boolean
        default: false
      cam:
        description: "Nur diese Cam-ID messen (leer = alle) — zum Kalibrieren"
        type: string
        default: ""
      limit:
        description: "Max. Anzahl Cams (0 = alle)"
        type: string
        default: "0"
  schedule:
    - cron: "20 6-18 * * *"   # Fallback: stündlich tagsüber (UTC)

permissions:
  contents: read

concurrency:
  group: measure-visibility
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install numpy requests Pillow
      - name: Measure visibility
        env:
          REFPOINTS_URL: ${{ secrets.REFPOINTS_URL }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          WEBCAM_INGEST_TOKEN: ${{ secrets.WEBCAM_INGEST_TOKEN }}
          # Optionale Tuning-Overrides (sonst Defaults im Script):
          PEAK_CONTRAST_THRESHOLD: ${{ vars.PEAK_CONTRAST_THRESHOLD }}
          PLACE_CONTRAST_THRESHOLD: ${{ vars.PLACE_CONTRAST_THRESHOLD }}
          VISIBLE_FRACTION: ${{ vars.VISIBLE_FRACTION }}
          BASELINE_MIN_SAMPLES: ${{ vars.BASELINE_MIN_SAMPLES }}
          PATCH_RADIUS_PX: ${{ vars.PATCH_RADIUS_PX }}
          NIGHT_LUMA: ${{ vars.NIGHT_LUMA }}
          # workflow_dispatch-Inputs (bei schedule leer → normaler Voll-Lauf).
          # Via ENV statt direkter ${{ }}-Interpolation → keine Shell-Injection.
          DRY_RUN: ${{ inputs.dry_run }}
          CAM_ID: ${{ inputs.cam }}
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=""
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "$CAM_ID" ] && ARGS="$ARGS --cam $CAM_ID"
          [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ] && ARGS="$ARGS --limit $LIMIT"
          echo "Starte: python measure_visibility.py $ARGS"
          python measure_visibility.py $ARGS
